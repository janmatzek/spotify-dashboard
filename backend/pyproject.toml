[project]
name = "spotify-backend"
version = "0.1.0"
description = "Spotify dashboard application backend"
authors = [{ name = "Jan Matzek", email = "jan.matzek@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "attrs>=25.3.0",
    "fastapi>=0.116.1",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlmodel>=0.0.24",
    "types-requests>=2.32.4.20250809",
    "uvicorn>=0.35.0",
    "prometheus-client>=0.21.0",
]

[dependency-groups]
dev = ["mypy>=1.17.1", "ruff>=0.12.10"]


[tool.ruff]
line-length = 80

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
