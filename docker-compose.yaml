services:
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - REFRESH_TOKEN=${REFRESH_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_LOGGING_CHANNEL_ID=${TELEGRAM_LOGGING_CHANNEL_ID}
      - TELEGRAM_ALERTING_CHANNEL_ID=${TELEGRAM_ALERTING_CHANNEL_ID}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - ENVIRONMENT=dev
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net
    volumes:
      - ./backend:/app

  db:
    image: postgres:16
    ports:
      - "${DB_PORT}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotify_data
    networks:
      - backend_net
    volumes:
      - spotify_data:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - frontend_net

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - backend_net

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
    ports:
      - "${LOKI_PORT}:3100"
    networks:
      - backend_net

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      - backend_net

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/alerting:/etc/grafana/provisioning/alerting:ro
    networks:
      - backend_net
# TODO: observability

networks:
  frontend_net: {}
  backend_net: {}

volumes:
  spotify_data: {}
  grafana_data: {}
