server {
    listen 80;
    server_name localhost;

    # Set the root directory for your static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # This is the crucial part for SPAs
    # It tries to serve a file, then a directory, then falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: If you need to proxy API requests to a backend service
    location /api {
        # Proxy API requests to backend container (FastAPI)
        proxy_pass http://backend:8040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}